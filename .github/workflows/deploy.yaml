name: deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-toraora
  cancel-in-progress: false

jobs:
  kube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Write kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Build
        run: kubectl kustomize . > "$RUNNER_TEMP/rendered.yaml"
      - name: Diff
        run: kubectl diff -f "$RUNNER_TEMP/rendered.yaml" || test $? -eq 1
      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl apply -f "$RUNNER_TEMP/rendered.yaml" --prune \
            -l app.kubernetes.io/managed-by=kube-config -n toraora
          kubectl rollout status deploy -n toraora --timeout=5m || true
