# Same IPv6 override as prod's ag-rabbitmq (kube-manifests): the cluster is IPv6-only.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: ag-demo-rabbitmq
spec:
  replicas: 1
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 2Gi
  override:
    statefulSet:
      spec:
        template:
          spec:
            initContainers:
              - name: ipv6-init
                image: docker.io/busybox:1.33.1
                imagePullPolicy: IfNotPresent
                command: ["sh", "-c", "echo \"{inet6, true}.\" > /ipv6/erl_inetrc"]
                volumeMounts:
                  - name: ipv6-cfg
                    mountPath: /ipv6
            volumes:
              - name: ipv6-cfg
                emptyDir: {}
            containers:
              - name: rabbitmq
                env:
                  - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
                    value: "-kernel inetrc '/ipv6/erl_inetrc' -proto_dist inet6_tcp"
                  - name: RABBITMQ_CTL_ERL_ARGS
                    value: "-proto_dist inet6_tcp"
                volumeMounts:
                  - name: ipv6-cfg
                    mountPath: /ipv6
