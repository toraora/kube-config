apiVersion: apps/v1
kind: Deployment
metadata:
  name: tr
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tr
  template:
    metadata:
      labels:
        app: tr
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: tr
          image: ghcr.io/hummus-2/tr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8787
              name: http
          env:
            # Properties proxy /status to this host and set x-tr-client-ip to the
            # real client address (Cloudflare's cf-connecting-ip would be the proxy).
            - name: CLIENT_IP_HEADER
              value: x-tr-client-ip
            - name: RETENTION_DAYS
              value: "365"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tr-db
                  key: url
            # Keys wired from the out-of-band tr-env Secret; toggling one is a diff here.
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tr-env
                  key: ADMIN_TOKEN
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: tr-env
                  key: SECRET
            # IPs are stored raw. Re-enable hashing by adding the key to tr-env and
            # setting optional: false.
            - name: IP_HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: tr-env
                  key: IP_HASH_SALT
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
