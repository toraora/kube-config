apiVersion: v1
kind: ConfigMap
metadata:
  name: webview
data:
  GIT_REPO_URL: https://github.com/jhmt-pw/jhmt-2027.git
  GIT_PUSH: "1"
  # Device fingerprinting through the shared TR collector (apps/tr).
  TR_COLLECTOR_URL: https://tr.tora.dev
  TR_SITE_ID: jhmt.poketwo.io
  # jhmt.poketwo.io sits behind Cloudflare, which overwrites this header.
  TR_CLIENT_IP_HEADERS: cf-connecting-ip
  # Discord login is enabled only when all of these plus the
  # DISCORD_CLIENT_SECRET / DISCORD_BOT_TOKEN secrets are set.
  DISCORD_CLIENT_ID: "1532242888858144848"
  DISCORD_GUILD_ID: "1372976637972320406"
  DISCORD_REQUIRED_ROLE_IDS: "1550663009515479090"
  DISCORD_REDIRECT_URI: https://jhmt.poketwo.io/api/auth/discord/callback
