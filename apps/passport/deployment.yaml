apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: passport-uploads-rwx
spec:
  storageClassName: cephfs-nvme-retain
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passport
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: passport
  template:
    metadata:
      labels:
        app: passport
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: passport
          image: ghcr.io/toraora/passport:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PUBLIC_URL
              value: https://passport.sfbanorcalarml.org
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: passport-db
                  key: url
          envFrom:
            - secretRef:
                name: passport-env
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: passport-uploads-rwx
