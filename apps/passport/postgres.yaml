apiVersion: v1
kind: Service
metadata:
  name: passport-db
spec:
  clusterIP: None
  selector:
    app: passport-db
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: passport-db
spec:
  serviceName: passport-db
  replicas: 1
  selector:
    matchLabels:
      app: passport-db
  template:
    metadata:
      labels:
        app: passport-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: passport
            - name: POSTGRES_DB
              value: passport
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passport-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "passport"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
