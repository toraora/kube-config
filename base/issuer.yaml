apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-http
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: imanasianninja@gmail.com
    privateKeySecretRef:
      name: letsencrypt-http-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
